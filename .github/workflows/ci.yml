# .github/workflows/ci.yml
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: agila
      # kar-ui-kit is consumed via a `file:../kar-ui-kit` dependency, which
      # only resolves because it's a sibling folder on a local dev machine.
      # Check it out as a true sibling here too, so npm ci/tsc/eslint/jest
      # can actually find it - without this, "Cannot find module 'kar-ui-kit'"
      # is the only possible outcome, since nothing else provides that path.
      - uses: actions/checkout@v4
        with:
          repository: Vandahlen/kar-ui-kit
          path: kar-ui-kit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # kar-ui-kit's own source imports react/react-native/react-native-svg
      # directly (agila's npm ci only installs agila's own node_modules and
      # symlinks kar-ui-kit in - it never installs kar-ui-kit's OWN
      # dependencies). Without this, tsc can't resolve those imports when it
      # follows the symlink into kar-ui-kit's real source files.
      - working-directory: kar-ui-kit
        run: npm ci
      - working-directory: agila
        run: npm ci
      - working-directory: agila
        run: npx tsc --noEmit
      - working-directory: agila
        run: npx eslint .
      - working-directory: agila
        run: npm test

  ios:
    # macos-14's default Xcode is 15.4; RN 0.86 requires >=16.1. macos-15
    # defaults to a current Xcode that satisfies this.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          path: agila
      - uses: actions/checkout@v4
        with:
          repository: Vandahlen/kar-ui-kit
          path: kar-ui-kit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # kar-ui-kit's own source imports react/react-native/react-native-svg
      # directly (agila's npm ci only installs agila's own node_modules and
      # symlinks kar-ui-kit in - it never installs kar-ui-kit's OWN
      # dependencies). Without this, tsc can't resolve those imports when it
      # follows the symlink into kar-ui-kit's real source files.
      - working-directory: kar-ui-kit
        run: npm ci
      - working-directory: agila
        run: npm ci
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: agila
      - name: Install CocoaPods dependencies
        working-directory: agila/ios
        run: bundle exec pod install
      - name: Build for iOS Simulator
        working-directory: agila/ios
        run: |
          xcodebuild \
            -workspace agila.xcworkspace \
            -scheme agila \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            build \
            CODE_SIGNING_ALLOWED=NO
